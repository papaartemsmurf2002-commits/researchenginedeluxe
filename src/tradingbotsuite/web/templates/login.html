<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator Login</title>
  <style>
    body { font-family: Georgia, "Segoe UI", sans-serif; background: #f3efe5; color: #1d1b18; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fffdf8; border: 1px solid #d8ccb4; border-radius: 12px; padding: 24px; width: min(420px, 90vw); }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccbda0; margin: 12px 0; }
    button { background: #7d5433; color: white; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
    .error { color: #8a2c20; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Operator Login</h1>
    <p>Use the local operator secret configured in <code>TBS_OPERATOR_UI_SECRET</code>.</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/ui/login">
      <input type="password" name="password" placeholder="Operator secret" required />
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
