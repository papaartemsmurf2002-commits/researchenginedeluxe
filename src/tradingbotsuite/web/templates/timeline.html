{% extends "base.html" %}
{% block content %}
<h1>Timeline</h1>
<p class="muted">This is the structured activity feed: decisions, execution, supervision, health changes, operator commands, jobs, and traces.</p>
<style>
  .timeline-status-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }
  .timeline-job-meta {
    display: grid;
    grid-template-columns: repeat(3, minmax(150px, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  @media (max-width: 640px) {
    .timeline-job-meta {
      grid-template-columns: 1fr;
    }
  }
</style>
<div class="card wide">
  <h3>Recent Feed</h3>
  <div class="inline-buttons" style="margin-bottom:0.8rem;">
    <label><input id="timeline-show-health" type="checkbox"> Show Health</label>
    <label><input id="timeline-show-metrics" type="checkbox"> Show Metrics</label>
    <label><input id="timeline-pause" type="checkbox"> Pause Refresh</label>
    <button class="secondary" onclick="refreshTimeline(true)">Refresh Now</button>
  </div>
  <div id="timeline-rows" class="list"><div class="empty">Loading...</div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("timeline-show-health").checked = false;
  document.getElementById("timeline-show-metrics").checked = false;

  function kindBadge(kind) {
    const mapping = {
      health_event: ["Health", "warn"],
      supervision_snapshot: ["Supervision", "neutral"],
      execution_metric: ["Metric", "neutral"],
      trade_event: ["Trade", "ok"],
      decision_packet: ["Packet", "ok"],
      action_ticket: ["Ticket", "neutral"],
      operator_command: ["Command", "neutral"],
      operator_job: ["Job", "neutral"],
      trace: ["Trace", "neutral"],
    };
    const pair = mapping[kind] || [kind || "item", "neutral"];
    return window.TBS.pill(pair[0], pair[1]);
  }

  function jobStatusBadge(status) {
    const normalized = String(status || "unknown");
    const stateClass = normalized === "succeeded" ? "ok" : (normalized === "failed" ? "bad" : (normalized === "running" || normalized === "queued" ? "warn" : "neutral"));
    return window.TBS.pill(normalized, stateClass);
  }

  function timelineSymbol(item) {
    if (item.symbol && item.symbol !== "BTCUSDT") return item.symbol;
    const payload = item.payload || {};
    const request = payload.request || {};
    const text = `${request.spec_path || ""} ${JSON.stringify(payload.result || {})}`.toLowerCase();
    if (text.includes("ethusdt")) return "ETHUSDT";
    if (text.includes("btcusdt")) return "BTCUSDT";
    return item.symbol || "";
  }

  function itemSummary(item) {
    if (item.kind === "operator_command") {
      return `${item.summary} ${(item.payload || {}).success === false ? "(failed)" : ""}`.trim();
    }
    if (item.kind === "operator_job") {
      return `${(item.payload || {}).job_type || item.summary} / ${(item.payload || {}).status || "unknown"}`;
    }
    if (item.kind === "health_event") {
      return `${item.summary} (${item.reason_code || "no reason"})`;
    }
    if (item.kind === "execution_metric") {
      return `${item.summary} ${(item.reason_code ? `(${item.reason_code})` : "")}`.trim();
    }
    return item.summary || item.kind || "item";
  }

  function jobDetails(item) {
    if (item.kind !== "operator_job") return "";
    const payload = item.payload || {};
    return `
      <div class="timeline-status-row">
        ${jobStatusBadge(payload.status)}
        <span class="muted">${window.TBS.escapeHtml(payload.error_text ? "failed with stored error" : "status stored by operator job loop")}</span>
      </div>
      <div class="timeline-job-meta">
        <div class="list-item"><strong>Requested</strong><div class="muted">${window.TBS.formatTime(item.time_ms)}</div></div>
        <div class="list-item"><strong>Started</strong><div class="muted">${payload.started_at_ms ? window.TBS.formatTime(payload.started_at_ms) : "not started"}</div></div>
        <div class="list-item"><strong>Finished</strong><div class="muted">${payload.finished_at_ms ? window.TBS.formatTime(payload.finished_at_ms) : "not finished"}</div></div>
      </div>
    `;
  }

  let timelineRefreshInFlight = false;

  async function refreshTimeline(force = false) {
    if (!force && document.getElementById("timeline-pause").checked) {
      return;
    }
    if (timelineRefreshInFlight) return;
    timelineRefreshInFlight = true;
    const showHealth = document.getElementById("timeline-show-health").checked;
    const showMetrics = document.getElementById("timeline-show-metrics").checked;
    try {
      const feed = await window.TBS.getJson(
        `/api/operator/feed?limit=120&include_health_events=${showHealth ? "true" : "false"}&include_execution_metrics=${showMetrics ? "true" : "false"}`
      );
      const items = feed.items || [];
      document.getElementById("timeline-rows").innerHTML = items.length ? items.map(item => `
        <div class="list-item">
          <div class="split">
            <div>${kindBadge(item.kind)}</div>
            <div class="muted">${window.TBS.formatTime(item.time_ms)}</div>
          </div>
          <div><strong>${window.TBS.escapeHtml(itemSummary(item))}</strong></div>
          ${jobDetails(item)}
          <div class="muted">${window.TBS.escapeHtml(timelineSymbol(item))}</div>
          <details class="details">
            <summary>Inspect</summary>
            <pre>${window.TBS.escapeHtml(window.TBS.pretty(item.payload || {}))}</pre>
          </details>
        </div>
      `).join("") : '<div class="empty">No recent feed items.</div>';
    } catch (error) {
      document.getElementById("timeline-rows").innerHTML = window.TBS.errorHtml("Timeline refresh failed", error);
    } finally {
      timelineRefreshInFlight = false;
    }
  }
  refreshTimeline();
  document.getElementById("timeline-show-health").addEventListener("change", () => refreshTimeline(true));
  document.getElementById("timeline-show-metrics").addEventListener("change", () => refreshTimeline(true));
  setInterval(refreshTimeline, 2000);
</script>
{% endblock %}
