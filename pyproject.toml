[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot-framework"
version = "0.1.0"
description = "Hyperliquid Lorentzian trading bot, backtester, and optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "hyperliquid-python-sdk>=0.19.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.4",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "pyarrow>=18.0.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.12",
  "PyYAML>=6.0.1",
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "uvicorn>=0.34.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "hypothesis>=6.100.0",
]
research = [
  "hmmlearn==0.3.3",
  "xgboost>=3.2.0,<4",
]
research-gpu = [
  "hmmlearn==0.3.3",
  "xgboost>=3.2.0,<4",
  "cupy-cuda12x>=13,<15",
  "nvidia-cuda-runtime-cu12>=12.8",
  "nvidia-cuda-nvrtc-cu12>=12.8",
]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
