[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot-framework"
version = "0.1.0"
description = "Hyperliquid Lorentzian trading bot, backtester, and optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "PyYAML>=6.0.1",
  "websockets>=12.0",
  "hyperliquid-python-sdk>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
